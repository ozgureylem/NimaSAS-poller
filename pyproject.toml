[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "saspy"
version = "0.1.0"
description = "Clean-room SAS 6.02 slot accounting system host client for Linux single-board computers"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["saspy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
